# Builds the downloadable game whenever main changes and publishes it to the
# `downloads` branch, so this link always gives the newest Windows build:
#   https://github.com/<owner>/<repo>/raw/downloads/BloomInProgress-windows.zip
name: Build downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - name: Get Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL --fail -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL --fail -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP"/godot/Godot_v*_linux.x86_64 "$RUNNER_TEMP/godot/godot"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/linux_release.x86_64" "templates/macos.zip" "templates/version.txt" -d "$templates"
          rm godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/godot/godot" >> "$GITHUB_ENV"

      - name: Run the tests
        run: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . res://tests/test_runner.tscn | tee rules.log
          grep -q "ALL TESTS PASSED" rules.log
          "$GODOT" --headless --path . res://tests/menu_test.tscn | tee menu.log
          grep -q "MENU TEST PASSED" menu.log
          "$GODOT" --headless --path . res://tests/home_test.tscn | tee home.log
          grep -q "HOME TEST PASSED" home.log
          tests/run_coop_test.sh "$GODOT"
          rm rules.log menu.log home.log

      - name: Build the downloads
        run: tools/build.sh "$GODOT"

      - name: Publish to the downloads branch
        run: tools/publish_downloads.sh

      # Keep the "latest" release on the Releases page in step, so an old
      # build is never left there.
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest export/BloomInProgress-windows.zip export/BloomInProgress-macos.zip export/BloomInProgress-linux.zip --clobber
            gh release edit latest --target "$GITHUB_SHA" --notes "Built from $GITHUB_SHA. Unzip **BloomInProgress-windows.zip** and double-click **BloomInProgress.exe**. The first time, Windows may warn that it doesn't recognise the app: click **More info**, then **Run anyway**."
          else
            gh release create latest export/BloomInProgress-windows.zip export/BloomInProgress-macos.zip export/BloomInProgress-linux.zip \
              --target "$GITHUB_SHA" --title "Bloom In Progress (latest build)" \
              --notes "Built from $GITHUB_SHA. Unzip **BloomInProgress-windows.zip** and double-click **BloomInProgress.exe**."
          fi
